name: Deploy Marp to GitHub Pages

on:
  push:
    branches: [ main ] # 当你推送到 main 分支时触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Marp to HTML
        run: |
          # 使用 npx 直接运行 marp-cli，将当前目录所有 md 转换为 html
         npx @marp-team/marp-cli@latest -I . -o dist --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
